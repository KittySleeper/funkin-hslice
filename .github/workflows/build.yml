
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: HaxeFoundation/setup-haxe@v2.0.3
        with:
          haxe-version: 4.3.2

      - name: Set up Haxelib and Lime
        run: |
          haxelib install lime 8.3.1 -y
          haxelib run lime setup -y
          haxelib set lime git -y

      - name: Build Windows target
        run: haxelib run lime build Project.xml windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Windows Build
          path: export/windows/bin/
          if-no-files-found: error
