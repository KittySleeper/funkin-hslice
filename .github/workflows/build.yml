
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: HaxeFoundation/setup-haxe@v2.0.3
        with:
          haxe-version: 4.3.2

      - name: Install HMM
        run: |
          haxelib --global install hmm -y

      - name: Install Haxelibs
        run: haxelib --global run hmm install

      - name: Set up Lime
        run: |
          haxelib run lime setup -y

      - name: Build Windows target
        run: haxelib run lime build windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Windows Build
          path: export/windows/bin/
          if-no-files-found: error
